apiVersion: apps/v1
kind: Deployment
metadata: 
  name: demo-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: demo-container
        image: k8s-app-demo:0.1.0
        readinessProbe:
          httpGet:
            path: /Health
            port: 8000
        livenessProbe:
          httpGet:
            path: /Health
            port: 8000 
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
